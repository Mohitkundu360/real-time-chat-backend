spring.application.name=chatapp

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/chatdb}
spring.datasource.username=${DB_USERNAME:chat}
spring.datasource.password=${DB_PASSWORD:chat}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
